MODULE_ID='greeter'
MODULE_KIND='system'
# greeter 是唯一真正动系统的模块：写 /etc、建 /var/lib、enable greetd、把别的显示管理器
# 关掉。所以它声明需要 root，引擎在动手前统一取一次权限（PLAN §0）。
MODULE_SYSTEM_PRIVILEGED='yes'
# greetd 在官方仓库，Noctalia 的登录界面在 AUR。
MODULE_REPO_PACKAGES=(greetd)
MODULE_AUR_PACKAGES=(noctalia-greeter)
# greetd 的 session 命令会被写进 root 读的配置并被 root 执行，所以它必须先在 PATH 上。
MODULE_REQUIRED_COMMANDS=('greetd:greetd' 'noctalia-greeter-session:noctalia-greeter')
MODULE_EXTERNAL_COMMANDS=(systemctl sudo)

# 下面这些同时是预检清单和动作脚本的输入：只写一遍，不给人两份不一致的机会。
GREETER_CONFIG='/etc/greetd/config.toml'
GREETER_DM_RECORD='/etc/greetd/noctalia-mod-display-manager'
GREETER_POLKIT_RULE='/etc/polkit-1/rules.d/50-noctalia-greeter.rules'
GREETER_STATE_DIR='/var/lib/noctalia-greeter'
# 认得的显示管理器：只有这几个名字能进记录文件，也只有它们会被 disable/enable。
GREETER_CONFLICTS=(sddm lightdm gdm ly)

MODULE_SYSTEM_SERVICES=(greetd)
MODULE_SYSTEM_PATHS=(
    "$GREETER_CONFIG"
    "$GREETER_POLKIT_RULE"
    "$GREETER_STATE_DIR"
    "$GREETER_DM_RECORD"
)
# install 之后必须在的东西。config.toml 用不了 MODULE_EXTERNAL_REFS（那是配置根内的
# 相对路径），所以这里的绝对路径就是它的落点。
MODULE_VALIDATE_PATHS=("$GREETER_CONFIG" "$GREETER_POLKIT_RULE" "$GREETER_STATE_DIR")
