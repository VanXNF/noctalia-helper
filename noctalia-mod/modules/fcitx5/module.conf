MODULE_ID='fcitx5'
# 系统级模块（PLAN §11 阶段 F）：没有配置根里的目标树，动作脚本自己说明会动什么。
MODULE_KIND='system'
# 输入法与雾凇拼音：rime-ice-git 是 AUR 包（方案数据），所以这一模块需要 AUR helper。
# `fcitx5-rime` 是引擎包，`librime` 带来的 rime_deployer 由 fcitx5-rime 依赖，不单独声明。
MODULE_REPO_PACKAGES=(fcitx5 fcitx5-gtk fcitx5-qt fcitx5-configtool fcitx5-rime)
MODULE_AUR_PACKAGES=(rime-ice-git)
# Niri 的默认配置在启动时 spawn fcitx5，那里也有同一条可选声明；这里声明是因为本模块
# 自己就要用它——两处都声明是有意的，谁也不能靠对方先装过。
MODULE_REQUIRED_COMMANDS=('fcitx5:fcitx5')
# 预编译要 rime_deployer；没有它就用 user.yaml 记住方案选择，功能不残。
MODULE_OPTIONAL_COMMANDS=('rime_deployer:librime')
MODULE_EXTERNAL_COMMANDS=(busctl timeout)
MODULE_SYSTEM_EXTRA_ACTIONS=(deploy activate rime)
# 预检清单：这一模块会碰的东西。素材与渲染产物在 ~/.local/share，主题选择在 ~/.config。
MODULE_SYSTEM_PATHS=(
    "$HOME/.local/share/fcitx5/themes/nyxmellow"
    "$HOME/.local/share/fcitx5/rime/default.custom.yaml"
    "$HOME/.config/fcitx5/profile"
    "$HOME/.config/fcitx5/conf/classicui.conf"
)
# install 动作必须产出这些：素材三个文件 + 雾凇拼音的挂载点与输入法条目。
MODULE_VALIDATE_PATHS=(
    "$HOME/.local/share/fcitx5/themes/nyxmellow/templates/theme.conf"
    "$HOME/.local/share/fcitx5/themes/nyxmellow/templates/panel.svg"
    "$HOME/.local/share/fcitx5/themes/nyxmellow/templates/highlight.svg"
    "$HOME/.local/share/fcitx5/rime/default.custom.yaml"
    "$HOME/.config/fcitx5/profile"
)
# Noctalia 的模板注册随 noctalia 模块发布（带 requires_path，没装皮肤时是惰性的），
# 所以这里不需要改写别人的配置文件，也就不需要 MODULE_EXTERNAL_REFS。
