MODULE_ID='fisher'
MODULE_KIND='system'
# curl 是下载引导脚本用的，不是"随便一个系统都有"——所以它进包清单，缺了 deps 会装。
MODULE_REPO_PACKAGES=(fish curl)
MODULE_REQUIRED_COMMANDS=('fish:fish' 'curl:curl')
MODULE_EXTERNAL_COMMANDS=(sha256sum timeout)
# 固定的上游版本：引导脚本按 commit 取、按 sha256 校验，插件同样钉在 commit 上。
#
# 这里与 fish 模块发布的锁文件是同一份内容，但两处都写是有意的：本模块是"我要装什么"
# 的权威，部署出来的锁文件是它核对的**前置条件**——用户改过锁文件就必须拒绝安装，
# 而不是照着自己那份清单把人家的配置覆盖掉。
MODULE_FISHER_BOOTSTRAP_REPO='jorgebucaran/fisher'
MODULE_FISHER_BOOTSTRAP_PATH='functions/fisher.fish'
MODULE_FISHER_BOOTSTRAP_COMMIT='791da644d33d392216f6b1a9b5fc1e470db6d7f2'
MODULE_FISHER_BOOTSTRAP_SHA256='0fb6c81ae3003e95b5671766fa6c25c3597066e29965b7772f6c1b007387356d'
MODULE_FISHER_PLUGINS=(
    'jorgebucaran/fisher@791da644d33d392216f6b1a9b5fc1e470db6d7f2'
    'jorgebucaran/autopair.fish@4d1752ff5b39819ab58d7337c69220342e9de0e2'
    'PatrickF1/fzf.fish@6a6136998879dcc1f29a405dfdd6b92c5f229c39'
)
# 所有权白名单：卸载只删这里面的文件，账本里出现别的名字一律视为坏账本。
MODULE_FISHER_MANAGED_FILES=(
    'functions/fisher.fish'
    'completions/fisher.fish'
    'conf.d/autopair.fish'
    'functions/_autopair_backspace.fish'
    'functions/_autopair_insert_left.fish'
    'functions/_autopair_insert_right.fish'
    'functions/_autopair_insert_same.fish'
    'functions/_autopair_tab.fish'
    'conf.d/fzf.fish'
    'completions/fzf_configure_bindings.fish'
    'functions/_fzf_configure_bindings_help.fish'
    'functions/_fzf_extract_var_info.fish'
    'functions/_fzf_preview_changed_file.fish'
    'functions/_fzf_preview_file.fish'
    'functions/_fzf_report_diff_type.fish'
    'functions/_fzf_report_file_type.fish'
    'functions/_fzf_search_directory.fish'
    'functions/_fzf_search_git_log.fish'
    'functions/_fzf_search_git_status.fish'
    'functions/_fzf_search_history.fish'
    'functions/_fzf_search_processes.fish'
    'functions/_fzf_search_variables.fish'
    'functions/_fzf_wrapper.fish'
    'functions/fzf_configure_bindings.fish'
)
MODULE_SYSTEM_PATHS=(
    "$HOME/.config/fish/functions"
    "$HOME/.config/fish/completions/fisher.fish"
    "$HOME/.config/fish/completions/fzf_configure_bindings.fish"
    "$HOME/.config/fish/conf.d/autopair.fish"
    "$HOME/.config/fish/conf.d/fzf.fish"
    "$HOME/.config/fish/fish_plugins"
)
# 装完必须在的东西：fisher 自己就是它装的第一个插件。
MODULE_VALIDATE_PATHS=(
    "$HOME/.config/fish/functions/fisher.fish"
    "$HOME/.config/fish/completions/fisher.fish"
)
