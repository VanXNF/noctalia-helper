MODULE_ID='xdg-desktop-portal'
MODULE_TARGET='xdg-desktop-portal'
# portals.conf 的 [preferred] 点名了 gnome / gtk 两个后端，Secret 接口指名
# gnome-keyring。这四个缺任何一个，被路由到的接口就是坏的，而 deps 会报"齐全"——
# 所以它们跟着模块自己的清单走，`deps xdg-desktop-portal` 是自足的。
MODULE_REPO_PACKAGES=(xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-gnome gnome-keyring)
MODULE_VALIDATE_PATHS=(niri-portals.conf portals.conf)
# 故意不声明 REQUIRED_COMMANDS：portal 与两个后端都装在 /usr/lib，不在 PATH 上，
# 声明了只会让运行时核对永远报 missing-required，属于假警报（PLAN §3 已知边界）。
