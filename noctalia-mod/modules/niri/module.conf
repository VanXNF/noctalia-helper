MODULE_ID='niri'
MODULE_TARGET='niri'
# 默认配置直接 invoke 的程序，它们的包必须在本模块自己的清单里 ——
# 这样 `deps niri` 就是自足的，不依赖"用户刚好也装了别的模块"。
# 少了这些，Mod+Return、Mod+E、音量键、会话启动、护眼提示就是坏的。
MODULE_REPO_PACKAGES=(niri kitty nautilus wireplumber libnotify python noctalia)
MODULE_PRESERVE=(monitor.kdl effects.kdl effects_normal.kdl glow.kdl colors.kdl)
MODULE_CHMOD=('scripts/*.sh' 'scripts/*.py')
MODULE_RELOAD_COMMAND=(niri msg action reload-config)
MODULE_VALIDATE_PATHS=(config.kdl monitor.kdl effects.kdl scripts/session-shell.sh)
MODULE_PARTS=(effects glow)
MODULE_PART_EFFECTS_TARGET='effects_normal.kdl'
MODULE_PART_EFFECTS_DEFAULT='default'
MODULE_PART_GLOW_TARGET='glow.kdl'
MODULE_PART_GLOW_DEFAULT='default'
# 默认配置 spawn 的程序
MODULE_REQUIRED_COMMANDS=(
    'niri:niri'
    'kitty:kitty'
    'nautilus:nautilus'
    'wpctl:wireplumber'
    'noctalia:noctalia'
    'python3:python'
    'notify-send:libnotify'
)
# 有 command -v 守卫，缺了只是少个功能，不影响桌面
MODULE_OPTIONAL_COMMANDS=(
    'wlsunset:wlsunset'
    'ddcutil:ddcutil'
    'tmux:tmux'
    'flatpak:flatpak'
    'fcitx5:fcitx5'
)
# 基础系统自带，不装也不管；声明出来是为了让 spawn 检查有个落点
MODULE_EXTERNAL_COMMANDS=(sh flock pkill pgrep)
