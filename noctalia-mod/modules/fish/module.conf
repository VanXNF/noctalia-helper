MODULE_ID='fish'
MODULE_TARGET='fish'
MODULE_REPO_PACKAGES=(fish)
MODULE_VALIDATE_PATHS=(config.fish conf.d/__custom__.fish)
# conf.d/__custom__.fish 会主动扫描用户自建的 ~/.config/fish/__custom__/，模块不提供它。
MODULE_EXTERNAL_REFS=(fish/__custom__)
# 目录部署是整棵树替换，本模块又不提供这些文件——不声明就等着下一次 install fish 把
# fisher 装的插件和用户自己的函数删干净。functions/ 整个是别人的（我们一个文件都没有），
# 所以整目录保留；conf.d/ 与 completions/ 里我们有自己的文件，只能按名保留 fisher 那几个。
MODULE_PRESERVE=(
    functions
    conf.d/autopair.fish
    conf.d/fzf.fish
    completions/fisher.fish
    completions/fzf_configure_bindings.fish
)
# fisher 会自己重写锁文件（插件列表）。我们仍然拥有它——所以照旧覆盖，只是不进指纹，
# 否则每次 fisher 重排一次顺序就要报一次漂移（PLAN §1）。
MODULE_RUNTIME_WRITES=(fish_plugins)
MODULE_REQUIRED_COMMANDS=('fish:fish')
