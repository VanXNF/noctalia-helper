MODULE_ID='noctalia'
MODULE_TARGET='noctalia'
MODULE_REPO_PACKAGES=(noctalia python python-gobject python-cairo gtk-layer-shell)
MODULE_CHMOD=('tools/*.py' 'wallpaper-hook.sh')
MODULE_VALIDATE_PATHS=(noctalia-config.toml templates/palette.toml tools/wallpaper-picker.py tools/orbit-launcher.py wallpaper-hook.sh mpv-hook.lua)
# 引用但不属于本模块：
#   gtk-3.0/gtk.css, gtk-4.0/gtk.css  由 Noctalia 在运行时按模板渲染产出
#   tools/orbit-items.toml            模块只提供 __custom__ 默认，这个是用户可选覆盖
#   niri/scratchpad-items*            Orbit 的可选用户覆盖（内置菜单树是兜底）
#   user-dirs.dirs / Wallpapers       由 xdg-user-dirs 与用户目录提供
MODULE_EXTERNAL_REFS=(
    gtk-3.0/gtk.css
    gtk-4.0/gtk.css
    noctalia/tools/orbit-items.toml
    niri/scratchpad-items__custom__.toml
    niri/scratchpad-items.toml
    niri/scratchpad-items.json
    user-dirs.dirs
    Wallpapers
)
# tools/ 是 Python 程序，wallpaper-hook.sh 也直接调 noctalia
MODULE_REQUIRED_COMMANDS=(
    'noctalia:noctalia'
    'python3:python'
)
# 都有 command -v 守卫；缺了只影响视频壁纸，不影响配置本身
MODULE_OPTIONAL_COMMANDS=(
    'ffmpeg:ffmpeg'
    'mpvpaper:mpvpaper'
)
