[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["kitty", "qt", "starship"]
community_ids = []

# NyxMellow 动态 fcitx5 皮肤（mellow 形状 + Material You 自动取色）。
# 素材由 fcitx5 模块部署到 fcitx5 的主题目录，注册留在这里：Noctalia 读的是本文件，
# 而 requires_path 让这一组在没装皮肤时自动跳过——于是 fcitx5 模块不必去改写别人的
# 配置文件，卸载皮肤也不会留下指向空路径的注册（PLAN §11 阶段 F）。路径里的占位符
# 由部署引擎替换成真实家目录，写法见下面 GTK 那段的说明。
[theme.templates.user.nyxmellow_theme]
index = 0
input_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/theme.conf"
output_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/theme.conf"
requires_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/theme.conf"

[theme.templates.user.nyxmellow_panel]
index = 1
input_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/panel.svg"
output_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/panel.svg"
requires_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/panel.svg"

[theme.templates.user.nyxmellow_highlight]
index = 2
input_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/highlight.svg"
output_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/highlight.svg"
requires_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/highlight.svg"
post_hook = "busctl --user --auto-start=no call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true"

# GTK Material You 主题（移植自 HyprYou，由 Noctalia 动态渲染到 gtk.css）
# 路径里的两个占位符由 noctalia-mod.deploy 在部署时替换：用户家目录、XDG 图片目录
# （后者只用在 [wallpaper] 与 mpvpaper 的那三行）。注释里不写占位符字面量，
# 免得部署时连注释一起被替换成一句读不通的话。
[theme.templates.user.gtk3]
index = 3
input_path = "/home/user/.config/noctalia/templates/gtk-3.0.css"
output_path = "/home/user/.config/gtk-3.0/gtk.css"

[theme.templates.user.gtk4]
index = 4
input_path = "/home/user/.config/noctalia/templates/gtk-4.0.css"
output_path = "/home/user/.config/gtk-4.0/gtk.css"

# Niri glow-material-you: Noctalia is the only writer of the rendered layout.
[theme.templates.user.niri_glow_material_you]
index = 5
input_path = "/home/user/.config/noctalia/templates/niri-glow-material-you.kdl"
output_path = "/home/user/.config/niri/colors.kdl"

# Material You 动态色板（由 Noctalia 渲染到 ~/.cache/noctalia-mod/palette.toml，供周边组件直接读取）
[theme.templates.user.palette]
index = 6
input_path = "/home/user/.config/noctalia/templates/palette.toml"
output_path = "/home/user/.cache/noctalia-mod/palette.toml"

[wallpaper]
directory = "@XDG_PICTURES@/Wallpapers"
fill_mode = "crop"


[plugins]
enabled = ["noctalia/mpvpaper"]

[widget.active_window]
min_length = 0

[widget.clock]
format = "{:%m/%d/%y %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 170

[widget.tray]
detached_panel = true
drawer = true

[widget.ram]
show_glyph = false
visualization = "none"

[widget.sysmon]
glyph = "cpu"
visualization = "none"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[plugin_settings."noctalia/mpvpaper"]
mpv_options = "--config=no --load-scripts=no --script=~/.config/noctalia/mpv-hook.lua"
picker_placement = "floating"
video_directory = "@XDG_PICTURES@/Wallpapers/video"
