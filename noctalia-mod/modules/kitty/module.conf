MODULE_ID='kitty'
MODULE_TARGET='kitty'
MODULE_REPO_PACKAGES=(kitty)
MODULE_RELOAD_COMMAND=(pkill -SIGUSR1 -x kitty)
# Noctalia 的内置 kitty 模板会就地改写这两个文件（删掉 BEGIN_KITTY_THEME 块、按当前
# 壁纸调色板重写主题）。它们仍然归模块所有、照旧被部署覆盖，只是不参与指纹——
# 否则 `plan` 每次都会报漂移（PLAN §10 P1-9）。
MODULE_RUNTIME_WRITES=(kitty.conf themes/noctalia.conf)
MODULE_VALIDATE_PATHS=(kitty.conf)
MODULE_REQUIRED_COMMANDS=('kitty:kitty')
